matches:
  - trigger: "ccjj"
    replace: "CodeCompanion"

  - trigger: "`jj"
    replace: |
      ```$|$
      ```
  - trigger: "prjj"
    replace: "Using `:CodeCompanionCodeReview` and walking through every single line change. I made inline feedback in the buffers and sent them to Claude Code via `#{code_review}`."
  - trigger: "dcpjj"
    replace: "docker compose pull"
  - trigger: "dcdjj"
    replace: "docker compose down"
  - trigger: "dcujj"
    replace: "docker compose up -d"

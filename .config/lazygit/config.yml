git:
  diffRenderers:
    - colorArg: always
      command: delta --{{colorScheme}} --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
os:
  editPreset: nvim
gui:
  showBottomLine: false
customCommands:
  - key: w
    context: remoteBranches
    description: Open in a worktrunk worktree
    command: wt-herdr {{.SelectedRemoteBranch.RemoteName}}/{{.SelectedRemoteBranch.Name}}
    output: terminal
